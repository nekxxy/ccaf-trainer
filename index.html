<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCAF Trainer — Claude Certified Architect Foundations Prep</title>
<meta name="description" content="Drill CCAF exam questions by category with spaced re-drill, streaks, and progress tracking. 100% client-side.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23FF6A2B%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%23111%22 font-family=%22sans-serif%22 font-weight=%22bold%22>C</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">CCAF</span><span class="brand-sub">Trainer</span>
    </div>
    <nav class="tabs-nav" id="mainNav" aria-label="Main navigation">
      <button class="nav-tab" data-view="study">Study</button>
      <button class="nav-tab" data-view="categories">Categories</button>
      <button class="nav-tab" data-view="progress">Progress</button>
      <button class="nav-tab" data-view="about">About</button>
    </nav>
    <div class="topbar-right">
      <span class="user-chip" id="userChip" title="That's you">
        <span class="user-avatar" id="userAvatar">?</span>
        <span class="user-name" id="userNameChip"></span>
      </span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode" title="Toggle theme">
        <span id="themeIcon"></span>
      </button>
    </div>
  </div>
  <div class="course-progress-track" id="courseProgressTrack" aria-label="Overall course progress">
    <div class="course-progress-fill" id="courseProgressFill"></div>
  </div>
</header>

<main id="app" class="app-main">
  <!-- Views are rendered here by app.js -->
</main>

<footer class="site-footer">
  <p>Questions compiled from publicly available sources (primarily CertiQ). Not officially affiliated with or endorsed by Anthropic.</p>
  <p class="footer-credit">Built by Vishnu NS (visns@deloitte.com) &mdash; for internal learning purposes only.</p>
</footer>

<div id="toastRoot" class="toast-root" aria-live="polite"></div>
<div id="confettiRoot" class="confetti-root" aria-hidden="true"></div>
<div id="speedNudgeRoot" class="speed-nudge-root" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
